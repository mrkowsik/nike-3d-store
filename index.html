<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e4e2dc" />
    <title>Virtual Store</title>
    <meta
      name="description"
      content="Walk around a 3D store, turn every product in your hands and fill your bag. A demo store: nothing is for sale."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Virtual Store" />
    <meta property="og:description" content="Walk around a 3D store, turn every product in your hands and fill your bag." />
    <meta property="og:image" content="%BASE_URL%og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A 3D store: ten jackets, hoodies and tops on a clothing rail under a NIKE sign" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Virtual Store" />
    <meta name="twitter:description" content="Walk around a 3D store, turn every product in your hands and fill your bag." />
    <meta name="twitter:image" content="%BASE_URL%og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body {
        background: #e4e2dc;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #loader {
        z-index: 100;
        color: #111;
        background: #e4e2dc;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: opacity .5s, visibility .5s;
        display: flex;
        position: fixed;
        inset: 0;
      }
      #loader.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .loader__name {
        letter-spacing: -.5px;
        font: italic 900 34px/1 Helvetica Neue, Helvetica, Arial, sans-serif;
      }
      .loader__tagline {
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #6f6d68;
        margin-top: 6px;
        font: 600 9px/1 Inter, system-ui, sans-serif;
      }
      .loader__bar {
        background: #1111111a;
        border-radius: 2px;
        width: 120px;
        height: 2px;
        margin-top: 22px;
        position: relative;
        overflow: hidden;
      }
      .loader__bar:after {
        content: "";
        background: #111;
        border-radius: 2px;
        width: 40%;
        animation: 1.1s cubic-bezier(.45,0,.25,1) infinite loader-slide;
        position: absolute;
        inset: 0;
      }
      @keyframes loader-slide {
        0% { transform: translate(-100%); }
        to { transform: translate(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .loader__bar:after { animation-duration: 3s; }
      }
    </style>
  </head>
  <body>
    <div id="loader" role="status" aria-label="Loading the store">
      <div class="loader__name">NIKE</div>
      <div class="loader__tagline">Virtual Store</div>
      <div class="loader__bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
